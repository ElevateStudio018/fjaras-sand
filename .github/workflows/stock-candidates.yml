name: Preview stock photos

# Downloads small previews of the Pexels photos listed in scrape/candidates.txt into scrape/candidates, so the photos
# can be looked at and chosen from where Pexels cannot be reached, and checks that each photo's address works.
on:
  push:
    branches: [main]
    paths: [.github/workflows/stock-candidates.yml, scrape/candidates.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download previews
        run: |
          mkdir -p scrape/candidates
          : > scrape/candidates/REPORT.txt
          for id in $(cat scrape/candidates.txt); do
            url="https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=600"
            code=$(curl -sL -o "scrape/candidates/$id.jpg" -w "%{http_code}" "$url")
            echo "$id $code" >> scrape/candidates/REPORT.txt
            [ "$code" = "200" ] || rm -f "scrape/candidates/$id.jpg"
          done
          cat scrape/candidates/REPORT.txt
      - name: Commit the previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scrape/candidates
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Förhandsbilder av stockbilder"
          git pull --rebase origin main
          git push
