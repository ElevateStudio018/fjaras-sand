name: Fetch the company's current website

# Fetches the pages, texts and photos of the company's current website into the repository
# (scripts/scrape-site.mjs) and commits them. Runs when the script or this file changes, or by hand.
on:
  push:
    branches: [main]
    paths: [.github/workflows/scrape-site.yml, scripts/scrape-site.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save cheerio@1
      - run: node scripts/scrape-site.mjs https://www.fjarassand.se/
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scrape public/photos/site
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Sidor och bilder hämtade från fjarassand.se"
          git pull --rebase origin main
          git push
